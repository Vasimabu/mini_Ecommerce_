 <div class="container my-5">
    
    <h2 class="text-center mb-4" *ngIf="cartItems.length > 0">
      Shopping Cart Item: {{ cartCount }}
    </h2>
  
    <div class="row">
      <div class="col-md-8">
        
        <div *ngIf="cartItems.length > 0; else emptyCart">
          
            <div *ngFor="let item of cartItems" class="cart-items">
                <div class="cart-item d-flex align-items-center mb-3 p-3 border rounded">
                  <img *ngIf="item.product?.Images?.length" 
                       [src]="item.product?.Images[0]?.image" 
                       alt="Product Image" 
                       class="img-fluid rounded cart-item-image mr-3">
                  <div class="cart-item-details flex-grow-1">
                    <div>
                      <a [routerLink]="'/product/' + item.product?.Id" 
                         class="cart-item-title mb-1">
                         {{ item.product?.Name || 'No Name' }}
                      </a>
                    </div>
                    <p class="cart-item-price mb-1">${{ item.product?.Price || '0.00' }}</p>
                    <div class="quantity-controls d-flex align-items-center">
                      <button class="quantity-btn" (click)="decreseqty(item.product.Id)">-</button>
                      <input type="text" 
                             class="quantity-display form-control text-center mx-2" 
                             [value]="item.qty" 
                             readonly>
                      <button class="quantity-btn" (click)="increaseqty(item.product.Id)">+</button>
                    </div>
                  </div>
                  <button class="btn btn-danger ml-3" (click)="deleteItem(item.product?.Id)">Remove</button>
                </div>
              </div>
              
              
        </div>
  
    
        <ng-template #emptyCart>
          <h3>Cart is empty</h3>
        </ng-template>
      </div>
  
      
      <div *ngIf="cartItems.length > 0" class="col-md-4">
        <div class="cart-summary p-3 border rounded">
          <h4 class="mb-3">Cart Summary</h4>
          
          <div class="d-flex justify-content-between mb-2">
            <p>SubTotal</p>
            <p>{{ subtotal }} (units)</p>
          </div>
          
          <div class="d-flex justify-content-between mb-2">
            <p>Est. Total</p>
            <p>${{ estamount.toFixed(2) }}</p>
          </div>
          
          <div class="d-flex justify-content-between mb-2">
            <p>Tax</p>
            <p>${{ tax.toFixed(2) }}</p>
          </div>
          
          <hr>
          
          <div class="d-flex justify-content-between">
            <h5>Total</h5>
            <h5>${{ total.toFixed(2) }}</h5>
          </div>
          
          <button class="btn btn-primary btn-block mt-3" (click)="orderComplete()">Proceed to Checkout</button>
        </div>
      </div>
    </div>
  </div>
