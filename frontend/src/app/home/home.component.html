  <!-- Page Heading -->

  <!-- Products Section -->
  <section id="products" class="container mt-5">
    <h5 class="products_heading text-center">Latest Products</h5>
    <div class="row">
        @if(products.length > 0){
        <!-- Product 1 -->
        <div *ngFor="let product of products" class="col-sm-12 col-md-6 col-lg-4 my-3">
          <div class="card p-3 rounded h-100 d-flex flex-column">
            <a [routerLink]="['/product/', product.Id]"><img class="card-img mx-auto" src="{{product.Images[0].image}}" alt="Product 1" ></a>
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">
                <a [routerLink]="['/product/', product.Id]">{{product.Name}}</a></h5>
              <div class="ratings mt-auto">
                <div class="rating-outer">
                    <div class="rating-inner" [ngStyle]="{'width': product.Ratings/ 5 * 100 + '%'}"></div>
                </div>
              </div>
              <p class="card-text">{{product.Price}}</p>
              <a [routerLink]="['/product/', product.Id]" class="btn btn-block btn-primary mt-auto">View Details</a>
            </div>
          </div>
        </div>
         }@else {
            <h3>no products to display</h3>
        }

      </div>
      
      
  </section>


  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
